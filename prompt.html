<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realtime Teleprompter</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/tabler-icons.min.css">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { width: 100%; height: 100%; background: #030303; }
body { width: 100%; height: 100%; overflow: hidden; background: #030303; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; }
:root { --hi:#f5c842; --bg:#030303; --sf:rgba(10,10,10,0.95); --bd:rgba(255,255,255,0.07); }

/* ── EDITOR ── */
#ed { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:32px 24px; }
.logo { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.28); display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.edlabel { display:flex; align-items:center; gap:8px; width:100%; max-width:620px; }
.edlabel span { font-size:12px; color:rgba(255,255,255,.3); letter-spacing:.08em; text-transform:uppercase; }
.mdbadge { font-size:10px; background:rgba(245,200,66,.12); border:1px solid rgba(245,200,66,.25); color:rgba(245,200,66,.7); border-radius:4px; padding:2px 7px; letter-spacing:.05em; font-weight:500; }
#ta { width:100%; max-width:620px; height:300px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07); border-radius:12px; color:rgba(255,255,255,.85); font-size:13.5px; line-height:1.75; padding:16px 18px; resize:none; outline:none; font-family:monospace; transition:border-color .2s; }
#ta:focus { border-color:rgba(255,255,255,.16); }
#ta::placeholder { color:rgba(255,255,255,.18); }
.mirbox { display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:11px 16px; width:100%; max-width:620px; }
.mirbox span { font-size:11px; color:rgba(255,255,255,.3); letter-spacing:.07em; text-transform:uppercase; font-weight:500; flex-shrink:0; }
.tgls { display:flex; gap:20px; margin-left:6px; }
.tgl { display:flex; align-items:center; gap:8px; font-size:13px; color:rgba(255,255,255,.4); cursor:pointer; user-select:none; }
.tgl input { display:none; }
.sw { width:34px; height:20px; background:rgba(255,255,255,.1); border-radius:100px; position:relative; transition:background .2s; flex-shrink:0; }
.sw::after { content:''; position:absolute; width:14px; height:14px; background:#fff; border-radius:50%; top:3px; left:3px; transition:transform .2s; }
.tgl input:checked + .sw { background:var(--hi); }
.tgl input:checked + .sw::after { transform:translateX(14px); }
.edrow { display:flex; align-items:center; width:100%; max-width:620px; }
.btn-begin { background:rgba(255,255,255,.9); color:#000; border:none; border-radius:100px; padding:11px 28px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:background .15s; margin-left:auto; }
.btn-begin:hover { background:var(--hi); }

/* ── PROMPTER ── */
#pr { display:none; position:fixed; inset:0; background:var(--bg); }
#prog { position:fixed; top:0; left:0; height:2px; background:var(--hi); opacity:.45; z-index:50; width:0; transition:width .4s ease; }
#sc { position:absolute; inset:0; overflow-y:scroll; scrollbar-width:none; padding-left:5vw; padding-right:5vw; cursor:grab; transition:left .3s cubic-bezier(0.25, 1, 0.5, 1); }
#sc:active { cursor:grabbing; }
#sc::-webkit-scrollbar { display:none; }
#words { margin:0 auto; font-family:Georgia,'Times New Roman',serif; font-size:48px; line-height:1.65; }
#words h1,#words h2,#words h3 { display:block; line-height:1.2; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif; scroll-margin-top: 36vh; }
#words h1 { font-size:1.2em; font-weight:300; letter-spacing:.02em; margin:.55em 0 .15em; border-bottom:1px solid rgba(255,255,255,.08); padding-bottom:.15em; }
#words h2 { font-size:1.06em; font-weight:600; margin:.55em 0 .12em; }
#words h3 { font-size:1em; font-weight:600; margin:.45em 0 .1em; }
#words p { display:block; margin:0 0 .3em; }
#words ul,#words ol { display:block; padding-left:1em; margin:0 0 .3em; }
#words li { display:list-item; margin:.06em 0; list-style-position:outside; }
#words blockquote { display:block; border-left:3px solid rgba(245,200,66,.22); padding-left:.7em; margin:.3em 0; font-style:italic; }
#words hr { display:block; border:none; border-top:1px solid rgba(255,255,255,.1); margin:.65em 0; }
#words code { font-family:'Courier New',monospace; font-size:.7em; background:rgba(255,255,255,.07); padding:.1em .3em; border-radius:3px; }
#words strong { font-weight:700; } #words em { font-style:italic; } #words a { color:inherit; text-decoration:none; }
.w { display:inline; color:rgba(255,255,255,.10); transition:color .12s ease-out; }
.w.p { color:rgba(255,255,255,.25); } .w.c { color:var(--hi); } .w.n { color:rgba(255,255,255,.86); }
#words h1 .w,#words h2 .w,#words h3 .w { color:rgba(255,255,255,.28); }
#words h1 .w.n,#words h2 .w.n,#words h3 .w.n { color:rgba(255,255,255,.5); }
#words h1 .w.p,#words h2 .w.p,#words h3 .w.p { color:rgba(255,255,255,.16); }
#ft { position:fixed; top:0; left:0; right:0; height:22vh; background:linear-gradient(to bottom,#030303 25%,transparent); pointer-events:none; z-index:10; }
#fb { position:fixed; bottom:0; left:0; right:0; height:22vh; background:linear-gradient(to top,#030303 25%,transparent); pointer-events:none; z-index:10; }
#guide { position:fixed; top:36vh; left:0; right:0; height:1px; background:rgba(245,200,66,.07); pointer-events:none; z-index:11; transition:background .3s; }
#guide::before { content:''; position:absolute; left:36px; top:-3px; width:6px; height:6px; border-radius:50%; background:rgba(245,200,66,.14); transition:all .3s; }
#guide.act { background:rgba(245,200,66,.28); } #guide.act::before { background:rgba(245,200,66,.8); }
#seeklabel { position:fixed; left:52px; top:36vh; transform:translateY(-140%); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:rgba(245,200,66,.7); opacity:0; transition:opacity .2s; pointer-events:none; z-index:12; }
#seeklabel.show { opacity:1; }
#hint { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:20; pointer-events:none; transition:opacity .8s; }
.hp { background:rgba(20,20,20,.93); border:1px solid rgba(255,255,255,.08); border-radius:100px; padding:10px 20px; font-size:14px; color:rgba(255,255,255,.5); display:flex; align-items:center; gap:8px; white-space:nowrap; }

/* ── SIDEBAR MENU ── */
#sb { position:fixed; top:0; left:-280px; width:280px; height:100%; background:rgba(6,6,6,0.96); border-right:1px solid var(--bd); z-index:40; display:flex; flex-direction:column; padding:24px 16px; transition:left .3s cubic-bezier(0.25, 1, 0.5, 1); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
#sb.open { left:0; }
#sb.open ~ #sc { left:120px; }
.sb-title { font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:rgba(255,255,255,0.3); margin-bottom:18px; padding-left:8px; display:flex; align-items:center; gap:6px; }
.sb-items { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:2px; scrollbar-width:none; }
.sb-items::-webkit-scrollbar { display:none; }
.sb-item { display:block; padding:9px 12px; border-radius:8px; color:rgba(255,255,255,0.45); font-size:13px; text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; transition:all 0.15s; }
.sb-item:hover { background:rgba(255,255,255,0.05); color:#fff; }
.sb-item.h1 { font-weight:600; padding-left:12px; font-size:13.5px; color:rgba(255,255,255,0.7); }
.sb-item.h2 { padding-left:24px; }
.sb-item.h3 { padding-left:36px; font-style:italic; font-size:12.5px; }

/* ── CONTROLS BAR ── */
#bar { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:2px; padding:6px; background:var(--sf); border:1px solid var(--bd); border-radius:100px; z-index:30; transition:opacity .5s; white-space:nowrap; backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); }
.cb { display:flex; align-items:center; gap:4px; background:transparent; border:none; color:rgba(255,255,255,.5); cursor:pointer; padding:8px 12px; border-radius:100px; font-size:13px; font-weight:500; font-family:inherit; transition:all .15s; white-space:nowrap; }
.cb:hover { background:rgba(255,255,255,.07); color:#fff; } .cb.pk { background:rgba(255,255,255,.1); color:#fff; } .cb.act { color:var(--hi); }
.sep { width:1px; height:16px; background:var(--bd); margin:0 2px; flex-shrink:0; }

/* Status Button Styling */
.cb.state-connecting { background: rgba(245, 200, 66, 0.15) !important; color: #f5c842 !important; font-weight: 600; }
.cb.state-ready { background: rgba(74, 222, 128, 0.18) !important; color: #4ade80 !important; font-weight: 700; border: 1px solid rgba(74, 222, 128, 0.2); }
.cb.state-ready i { animation: voicePulse 1.4s ease-in-out infinite; }

.lbl { font-size:11px; color:rgba(255,255,255,.3); min-width:30px; text-align:center; }
@keyframes voicePulse { 0%,100% { transform: scale(1); opacity:1; } 50% { transform: scale(1.12); opacity:0.6; } }
#pr.mirH #words { display:block; transform:scaleX(-1); }
#pr.mirV #words { display:block; transform:scaleY(-1); }
#pr.mirH.mirV #words { display:block; transform:scaleX(-1) scaleY(-1); }
</style>
</head>
<body>

<div id="ed">
  <div class="logo"><i class="ti ti-align-left" style="font-size:17px" aria-hidden="true"></i>Teleprompter</div>
  <div class="edlabel"><span>Script</span><span class="mdbadge">Markdown + config</span></div>
  <textarea id="ta" placeholder="---
font: 48          # font size in pixels  (default: 48)
width: 55         # column width in %    (default: 55)
lang: en-US       # recognition language (default: en-US)
sensitivity: normal # conservative | normal | fast
---

# Speech title

Good evening everyone. Paste your script here.
Headings are shown but never highlighted — you don't need to say them.

## Section heading

Use **bold** for key points and *italic* for asides.

- Bullet points work fine
- Like this

> Blockquotes for quotes or stage directions

---

## Next section
Continue here…"></textarea>
  <div class="mirbox">
    <span>Mirror</span>
    <div class="tgls">
      <label class="tgl"><input type="checkbox" id="mo-h"><div class="sw"></div>Horizontal</label>
      <label class="tgl"><input type="checkbox" id="mo-v"><div class="sw"></div>Vertical</label>
    </div>
  </div>
  <div class="edrow">
    <button class="btn-begin" onclick="launch()">Begin <i class="ti ti-arrow-right" style="font-size:13px;vertical-align:-1px" aria-hidden="true"></i></button>
  </div>
</div>

<div id="pr">
  <div id="prog"></div>
  <div id="ft"></div><div id="fb"></div>
  <div id="guide"></div>
  <div id="seeklabel">Reposition</div>
  
  <div id="sb">
    <div class="sb-title"><i class="ti ti-list" style="font-size:14px" aria-hidden="true"></i> Navigation</div>
    <div class="sb-items" id="sbItems"></div>
  </div>

  <div id="sc"><div id="words"></div></div>
  <div id="hint"><div class="hp"><i class="ti ti-microphone" style="font-size:16px" aria-hidden="true"></i>Space to listen &nbsp;·&nbsp; M to toggle menu &nbsp;·&nbsp; scroll to seek</div></div>
  <div id="bar">
    <button class="cb" id="mbtg" onclick="togMenu()" title="Toggle Sidebar (M)"><i class="ti ti-menu-2" style="font-size:14px" aria-hidden="true"></i> <span id="mtxt">Menu</span></button>
    <div class="sep"></div>
    <button class="cb pk" id="bp" onclick="tog()"><i class="ti ti-player-play" id="pi" style="font-size:13px" aria-hidden="true"></i><span id="pl">Listen</span></button>
    <div class="sep"></div>
    <button class="cb" onclick="adjF(-4)" aria-label="smaller">A−</button>
    <span class="lbl" id="fsize">48</span>
    <button class="cb" onclick="adjF(4)"  aria-label="larger">A+</button>
    <div class="sep"></div>
    <button class="cb" onclick="adjW(-5)" title="Narrow column">←</button>
    <span class="lbl" id="wlbl">55%</span>
    <button class="cb" onclick="adjW(5)"  title="Wide column">→</button>
    <div class="sep"></div>
    <button class="cb" id="mbh" onclick="mirH()"><i class="ti ti-flip-horizontal" style="font-size:14px" aria-hidden="true"></i>H</button>
    <button class="cb" id="mbv" onclick="mirV()"><i class="ti ti-flip-vertical"   style="font-size:14px" aria-hidden="true"></i>V</button>
    <div class="sep"></div>
    <button class="cb" onclick="goFull()" title="Fullscreen (F)"><i class="ti ti-maximize" id="fsico" style="font-size:15px" aria-hidden="true"></i></button>
    <div class="sep"></div>
    <button class="cb" onclick="goBack()"><i class="ti ti-pencil" style="font-size:13px" aria-hidden="true"></i> Edit</button>
  </div>
</div>

<script>
/* ── State ── */
var W=[],I=0,FS=48,LW=55,MIRH=false,MIRV=false,TGT=0,RAF=null,HT=null;
var SCROLLING=false,scrollEndT=null,REC=null,LIS=false,MENU_OPEN=false,MIC_CONNECTED=false;
var CFG={ font:48, width:55, lang:'en-US', sensitivity:'normal' };

var SENS = {
  conservative: { lookahead: 10 },
  normal:       { lookahead: 18 },
  fast:         { lookahead: 26 }
};

/* ── Config parser ── */
function parseCfg(raw) {
  var cfg = { font:48, width:55, lang:'en-US', sensitivity:'normal' };
  var text = raw.trim();
  if(!text.startsWith('---')) return { cfg:cfg, script:text };
  var end = text.indexOf('\n---', 3);
  if(end === -1) return { cfg:cfg, script:text };
  var fm = text.slice(3, end).trim();
  var script = text.slice(end+4).trim();
  fm.split('\n').forEach(function(line){
    var m = line.match(/^\s*([\w-]+)\s*:\s*([^#]+)/);
    if(!m) return;
    var k = m[1].toLowerCase().replace(/-/g,'');
    var v = m[2].trim();
    if(k==='font'||k==='fontsize')           cfg.font        = parseInt(v)||48;
    if(k==='width'||k==='columnwidth')       cfg.width       = parseInt(v)||55;
    if(k==='lang'||k==='language')           cfg.lang        = v;
    if(k==='sensitivity'||k==='speed')       cfg.sensitivity = v;
  });
  return { cfg:cfg, script:script };
}

/* ── Markdown parser ── */
function mdParse(txt){
  var lines=txt.split('\n'),html='',inUL=false,inOL=false;
  function cl(){if(inUL){html+='</ul>';inUL=false;}if(inOL){html+='</ol>';inOL=false;}  }
  function inl(t){
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/__(.+?)__/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/_(.+?)_/g,'<em>$1</em>')
      .replace(/`(.+?)`/g,'<code>$1</code>');
  }
  lines.forEach(function(ln){
    if(/^### (.+)/.test(ln))       {cl();html+='<h3>'+inl(ln.slice(4))+'</h3>';}
    else if(/^## (.+)/.test(ln))   {cl();html+='<h2>'+inl(ln.slice(3))+'</h2>';}
    else if(/^# (.+)/.test(ln))    {cl();html+='<h1>'+inl(ln.slice(2))+'</h1>';}
    else if(/^(---+|\*\*\*+)$/.test(ln.trim())){cl();html+='<hr>';}
    else if(/^> (.+)/.test(ln))    {cl();html+='<blockquote>'+inl(ln.slice(2))+'</blockquote>';}
    else if(/^[-*] (.+)/.test(ln)) {if(!inUL){cl();html+='<ul>';inUL=true;}html+='<li>'+inl(ln.slice(2))+'</li>';}
    else if(/^\d+\. (.+)/.test(ln)){if(!inOL){cl();html+='<ol>';inOL=true;}html+='<li>'+inl(ln.replace(/^\d+\. /,''))+'</li>';}
    else if(!ln.trim())            {cl();html+='<br>';}
    else                           {cl();html+='<p>'+inl(ln)+'</p>';}
  });
  cl();return html;
}

function inH(el){
  var p=el.parentElement;
  while(p){if(/^H[123]$/.test(p.tagName))return true;if(p.id==='words')break;p=p.parentElement;}
  return false;
}

function build(txt){
  var c=document.getElementById('words'); W=[];
  c.innerHTML=mdParse(txt);
  
  var hCount = 0;
  var tags = c.querySelectorAll('h1, h2, h3');
  tags.forEach(function(el) {
    el.id = 'h-tag-' + hCount++;
  });

  var walker=document.createTreeWalker(c,NodeFilter.SHOW_TEXT,null,false),nodes=[],n;
  while((n=walker.nextNode()))nodes.push(n);
  
  nodes.forEach(function(node){
    var text=node.textContent;if(!text.trim())return;
    var tokens=text.split(/(\s+)/),frag=document.createDocumentFragment();
    tokens.forEach(function(tok){
      if(!tok)return;
      if(/^\s+$/.test(tok)){frag.appendChild(document.createTextNode(tok));return;}
      var s=document.createElement('span');s.className='w';s.textContent=tok;frag.appendChild(s);
      
      var isHeadingWord = inH(s);
      W.push({c:tok.toLowerCase().replace(/[^a-z0-9']/g,''),e:s,h:isHeadingWord});
    });
    node.parentNode.replaceChild(frag,node);
  });

  buildSidebarMenu(tags);
}

/* ── SIDEBAR BUILDER ── */
function buildSidebarMenu(headingNodes) {
  var container = document.getElementById('sbItems');
  container.innerHTML = '';
  
  if (headingNodes.length === 0) {
    var empty = document.createElement('div');
    empty.style.cssText = 'font-size:12px; color:rgba(255,255,255,0.2); padding:8px; font-style:italic;';
    empty.textContent = 'No headings found';
    container.appendChild(empty);
    return;
  }

  headingNodes.forEach(function(el) {
    var btn = document.createElement('a');
    btn.className = 'sb-item ' + el.tagName.toLowerCase();
    btn.textContent = el.textContent || '';
    btn.onclick = function() {
      scrollToHeadingElement(el.id);
    };
    container.appendChild(btn);
  });
}

function scrollToHeadingElement(id) {
  var el = document.getElementById(id);
  if (!el) return;
  
  SCROLLING = false;
  var sc = document.getElementById('sc');
  var sr = sc.getBoundingClientRect();
  var er = el.getBoundingClientRect();
  
  TGT = sc.scrollTop + (er.top - sr.top) - sr.height * 0.36;
  
  for (var i = 0; i < W.length; i++) {
    var parent = W[i].e.parentElement;
    var matched = false;
    while(parent && parent.id !== 'words') {
      if (parent.id === id) { matched = true; break; }
      parent = parent.parentElement;
    }
    if (matched) { I = i; break; }
  }

  skipH();
  if(!RAF) RAF = requestAnimationFrame(anim);
  ro();
}

function togMenu() {
  MENU_OPEN = !MENU_OPEN;
  document.getElementById('sb').classList.toggle('open', MENU_OPEN);
  document.getElementById('mbtg').classList.toggle('act', MENU_OPEN);
  document.getElementById('mtxt').textContent = MENU_OPEN ? 'Close' : 'Menu';
}

function skipH(){while(I<W.length&&W[I].h)I++;}

function updateLayout(){
  var sc=document.getElementById('sc');
  sc.style.paddingTop    = Math.round(window.innerHeight*0.36)+'px';
  sc.style.paddingBottom = Math.round(window.innerHeight*0.68)+'px';
}

/* ── Launch / back ── */
function launch(){
  var raw=document.getElementById('ta').value.trim();
  if(!raw){document.getElementById('ta').focus();return;}

  var parsed=parseCfg(raw);
  CFG=parsed.cfg;
  FS=CFG.font; LW=CFG.width;
  document.getElementById('fsize').textContent=FS;
  document.getElementById('wlbl').textContent=LW+'%';

  MIRH=document.getElementById('mo-h').checked;
  MIRV=document.getElementById('mo-v').checked;

  build(parsed.script);
  I=0;skipH();
  updateLayout();

  var wds=document.getElementById('words');
  wds.style.maxWidth=LW+'%';
  wds.style.fontSize=FS+'px';

  var pr=document.getElementById('pr');
  pr.style.display='block';
  pr.classList.toggle('mirH',MIRH);
  pr.classList.toggle('mirV',MIRV);
  document.getElementById('mbh').classList.toggle('act',MIRH);
  document.getElementById('mbv').classList.toggle('act',MIRV);
  document.getElementById('ed').style.display='none';
  ro();
  
  // WARM-UP TRIGGER: Fire up the mic engine silently in the background immediately on launch
  setTimeout(function(){
    if(!REC) initRec(true); 
  }, 400);

  setTimeout(function(){
    var h=document.getElementById('hint');
    h.style.opacity='0';
    setTimeout(function(){h.style.display='none';},800);
  },3500);
}

function goBack() {
  LIS=false; MIC_CONNECTED = false;
  var r=REC;REC=null;
  if(r){try{r.abort();}catch(e){}}
  if(document.fullscreenElement){try{document.exitFullscreen();}catch(e){}}
  SCROLLING=false;if(RAF){cancelAnimationFrame(RAF);RAF=null;}
  vu();
  if (MENU_OPEN) togMenu();
  document.getElementById('pr').style.display='none';
  document.getElementById('pr').classList.remove('mirH','mirV');
  var h=document.getElementById('hint');h.style.display='';h.style.opacity='1';
  document.getElementById('ed').style.display='flex';
}

/* ── Render ── */
function ro(){
  W.forEach(function(w,i){
    var cls='w';
    if(i<I)         cls+=' p';
    else if(i===I)  cls+=w.h?' n':' c';
    else if(i<I+26) cls+=' n';
    w.e.className=cls;
  });
  document.getElementById('prog').style.width=(W.length?I/W.length*100:0)+'%';
}

function r(){
  ro();
  if(!SCROLLING&&W[I]){
    var sc=document.getElementById('sc'),el=W[I].e;
    var sr=sc.getBoundingClientRect(),er=el.getBoundingClientRect();
    TGT=sc.scrollTop+(er.top-sr.top)-sr.height*0.36;
    if(!RAF)RAF=requestAnimationFrame(anim);
  }
}
function anim(){
  if(SCROLLING){RAF=null;return;}
  var sc=document.getElementById('sc'),d=TGT-sc.scrollTop;
  if(Math.abs(d)<0.5){sc.scrollTop=TGT;RAF=null;return;}
  sc.scrollTop+=d*0.32; 
  RAF=requestAnimationFrame(anim);
}
function syncFromScroll(){
  var lineY=window.innerHeight*0.36;
  if(!W.length)return;
  var lo=0,hi=W.length-1;
  while(lo<hi){var mid=Math.floor((lo+hi)/2),rm=W[mid].e.getBoundingClientRect();if(rm.top+rm.height/2<lineY)lo=mid+1;else hi=mid;}
  if(lo>0){var rA=W[lo-1].e.getBoundingClientRect(),rB=W[lo].e.getBoundingClientRect();if(Math.abs(rA.top+rA.height/2-lineY)<Math.abs(rB.top+rB.height/2-lineY))lo=lo-1;}
  I=lo;skipH();TGT=document.getElementById('sc').scrollTop;ro();
}

/* ── Helper: Fuzzy Matcher ── */
function isFuzzyMatch(s1, s2) {
  if (s1 === s2) return true;
  if (!s1 || !s2) return false;
  
  // FIX: Aggressive root-matching rule for immediate startup.
  // If the word starts with the first 3 characters correctly, force lock-on.
  if (s1.length >= 3 && s2.length >= 3) {
    if (s1.slice(0, 3) === s2.slice(0, 3)) return true;
  }

  if (Math.abs(s1.length - s2.length) > 2) return false;

  var m = [];
  for (var i = 0; i <= s1.length; i++) m[i] = [i];
  for (var j = 0; j <= s2.length; j++) m[0][j] = j;
  for (var i = 1; i <= s1.length; i++) {
    for (var j = 1; j <= s2.length; j++) {
      m[i][j] = s1.charAt(i - 1) === s2.charAt(j - 1) 
        ? m[i - 1][j - 1] 
        : Math.min(m[i - 1][j - 1] + 1, Math.min(m[i][j - 1] + 1, m[i - 1][j] + 1));
    }
  }
  var distance = m[s1.length][s2.length];
  var maxLen = Math.max(s1.length, s2.length);
  return (1 - distance / maxLen) >= 0.75;
}

/* ── Recognition Engine ── */
function tog(){
  if(!REC) {
    initRec(false);
  } else {
    LIS=!LIS; 
    vu();
  }
}

function initRec(silentWarmup){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Speech recognition requires Chrome or Edge.');return;}
  REC=new SR();REC.continuous=true;REC.interimResults=true;
  REC.lang=CFG.lang||'en-US';
  
  REC.onstart=function(){
    MIC_CONNECTED = true;
    vu();
  };
  
  REC.onsoundstart=function(){
    MIC_CONNECTED = true;
    vu();
  };
  
  REC.onresult=function(e){
    if(!LIS)return;
    MIC_CONNECTED = true;
    
    var fullTranscript = '';
    for (var i = Math.max(0, e.results.length - 2); i < e.results.length; i++) {
      if (e.results[i] && e.results[i][0]) {
        fullTranscript += e.results[i][0].transcript + ' ';
      }
    }
    
    var words = fullTranscript.toLowerCase().replace(/[^a-z0-9'\s]/g,'').split(/\s+/).filter(Boolean);
    if(words.length){
      matchTranscriptSequence(words.slice(-3)); 
    }
  };
  
  REC.onerror=function(e){
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      LIS=false;MIC_CONNECTED=false;vu();
    }
  };
  
  REC.onend=function(){
    if(!REC)return;
    setTimeout(function(){if(REC){try{REC.start();}catch(e){}}},100);
  };
  
  LIS = !silentWarmup; 
  MIC_CONNECTED = false; 
  vu(); 
  try{REC.start();}catch(e){}
}

function vu(){
  var bp=document.getElementById('bp'), pi=document.getElementById('pi'), l=document.getElementById('pl');
  
  bp.className = 'cb pk';
  
  if(LIS) {
    if(MIC_CONNECTED) {
      bp.className = 'cb pk state-ready';
      pi.className = 'ti ti-microphone';
      l.textContent = 'READY / LISTENING';
    } else {
      bp.className = 'cb pk state-connecting';
      pi.className = 'ti ti-loader';
      l.textContent = 'Connecting...';
    }
  } else {
    if(MIC_CONNECTED) {
      pi.className = 'ti ti-player-play';
      l.textContent = 'Listen (Mic Ready)';
    } else {
      pi.className = 'ti ti-player-play';
      l.textContent = 'Listen';
    }
  }
}

/* ── DYNAMIC ALIGNMENT ENGINE ── */
function matchTranscriptSequence(phrase) {
  if (!phrase.length) return;

  var preset = SENS[CFG.sensitivity] || SENS.normal;
  var lookback = 4; // Expanded tracking lookback
  var lookahead = preset.lookahead;
  
  // Expand startup catch parameters aggressively
  if (I <= 2) {
    lookahead = Math.max(lookahead, 20);
  }

  var startSearch = Math.max(0, I - lookback);
  var endSearch = Math.min(W.length, I + lookahead);

  var bestNewIdx = -1;
  var bestScore = -1;

  var minMatchesForJump = 2;
  if (CFG.sensitivity === 'conservative') minMatchesForJump = 3;
  if (CFG.sensitivity === 'fast') minMatchesForJump = 1;

  // If you are starting up, accept single word drops gracefully
  if (I <= 2) minMatchesForJump = 1;

  for (var s = startSearch; s < endSearch; s++) {
    var matchCount = 0;
    var currentScriptIdx = s;
    var lastMatchedScriptIdx = -1;

    for (var pIdx = 0; pIdx < phrase.length; pIdx++) {
      for (var look = 0; look < 3; look++) {
        var idx = currentScriptIdx + look;
        if (idx >= W.length || idx >= s + 10) break;
        if (W[idx].h) continue; 

        if (isFuzzyMatch(W[idx].c, phrase[pIdx])) {
          matchCount++;
          lastMatchedScriptIdx = idx;
          currentScriptIdx = idx + 1;
          break; 
        }
      }
    }

    if (matchCount === 0) continue;

    var score = matchCount * 6;
    var distance = Math.abs(s - I);
    var proximityBias = 1.0 - (distance * 0.04);
    score *= proximityBias;

    var isJump = (lastMatchedScriptIdx > I + 1);
    if (isJump && matchCount < minMatchesForJump) {
      continue; 
    }

    if (score > bestScore) {
      bestScore = score;
      bestNewIdx = lastMatchedScriptIdx + 1;
    }
  }

  if (bestNewIdx !== -1 && bestNewIdx !== I) {
    if (bestNewIdx >= I - lookback && bestNewIdx <= I + lookahead) {
      I = bestNewIdx;
      skipH();
      r();
    }
  }
}

/* ── Controls ── */
function adjF(d){FS=Math.max(20,Math.min(96,FS+d));document.getElementById('words').style.fontSize=FS+'px';document.getElementById('fsize').textContent=FS;}
function adjW(d){LW=Math.max(25,Math.min(92,LW+d));document.getElementById('words').style.maxWidth=LW+'%';document.getElementById('wlbl').textContent=LW+'%';}
function mirH(){MIRH=!MIRH;document.getElementById('pr').classList.toggle('mirH',MIRH);document.getElementById('mbh').classList.toggle('act',MIRH);}
function mirV(){MIRV=!MIRV;document.getElementById('pr').classList.toggle('mirV',MIRV);document.getElementById('mbv').classList.toggle('act',MIRV);}
function goFull(){
  if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
  else document.exitFullscreen&&document.exitFullscreen();
}
document.addEventListener('fullscreenchange',function(){
  var ico=document.getElementById('fsico');
  if(ico)ico.className='ti '+(document.fullscreenElement?'ti-minimize':'ti-maximize');
});
window.addEventListener('resize',function(){updateLayout();if(W[I])r();});

/* ── Manual scroll & Keys ── */
(function(){
  var sc=document.getElementById('sc'),guide=document.getElementById('guide'),label=document.getElementById('seeklabel'),bar=document.getElementById('bar');
  function showBar(){bar.style.opacity='1';clearTimeout(HT);HT=setTimeout(function(){if(!SCROLLING)bar.style.opacity='0.08';},3500);}
  function onManual(){
    if(!W.length)return;SCROLLING=true;
    if(RAF){cancelAnimationFrame(RAF);RAF=null;}
    TGT=sc.scrollTop;guide.classList.add('act');label.classList.add('show');
    bar.style.opacity='1';clearTimeout(HT);clearTimeout(scrollEndT);
  }
  sc.addEventListener('wheel',onManual,{passive:true});
  sc.addEventListener('touchstart',onManual,{passive:true});
  sc.addEventListener('scroll',function(){
    showBar();if(!SCROLLING)return;TGT=sc.scrollTop;clearTimeout(scrollEndT);
    scrollEndT=setTimeout(function(){
      SCROLLING=false;guide.classList.remove('act');label.classList.remove('show');
      syncFromScroll();HT=setTimeout(function(){bar.style.opacity='0.08';},3500);
    },180);
  });
  document.getElementById('pr').addEventListener('mousemove',showBar);
  document.getElementById('pr').addEventListener('touchstart',function(){showBar();},{passive:true});
  document.addEventListener('keydown',function(e){
    if(document.getElementById('pr').style.display==='none')return;
    if(e.code==='Space')                             {e.preventDefault();tog();}
    if(e.code==='KeyM')                              {e.preventDefault();togMenu();}
    if(e.code==='Escape')                            {document.fullscreenElement?goFull():goBack();}
    if(e.code==='KeyF')                              {goFull();}
    if(e.code==='Equal'||e.code==='NumpadAdd')      {adjF(4);}
    if(e.code==='Minus'||e.code==='NumpadSubtract') {adjF(-4);}
    if(e.code==='BracketLeft')                      {adjW(-5);}
    if(e.code==='BracketRight')                     {adjW(5);}
  });
})();
